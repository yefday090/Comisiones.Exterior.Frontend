<div class="login-wrapper">
  <div class="login-card">
    <h1>Comisiones Exterior</h1>
    <p class="subtitle">Iniciá sesión para continuar</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

      <button type="submit" [disabled]="!loginForm.form.valid || loading">
        @if (loading) {
          Iniciando sesión...
        } @else {
          Ingresar
        }
      </button>
    </form>
  </div>
</div>
